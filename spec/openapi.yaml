openapi: 3.1.0
info:
  title: Comfy API v2
  version: 2.0.0
  description: |
    Canonical HTTP contract for the Comfy API v2 asset + job surface.

    This document is the source `comfy_low` (the generated protocol bindings) is
    emitted from. It describes all nine `/api/v2/*` operations plus every typed
    schema. The parts OpenAPI codegen cannot express (a reconnecting SSE event
    iterator, a streaming multipart upload, range-aware binary download) are
    documented here but implemented by hand in `comfy_sdk`; they are marked with
    the `x-sse-events`, `x-streaming-upload`, and `x-binary-stream` vendor
    extensions so the boundary between the two layers stays machine-checkable.

    The API behaves identically across three surfaces (self-hosted ComfyUI,
    Comfy Cloud, serverless). The only per-surface difference is the base URL and
    an optional bearer key.

servers:
  - url: /
    description: Any Comfy API v2 surface (self-hosted / Cloud / serverless)

security:
  - bearerAuth: []
  - {}

tags:
  - name: assets
    description: Content-addressed asset upload, dedup, and retrieval.
  - name: jobs
    description: Durable job submission, status, live events, and cancellation.

paths:
  /api/v2/assets:
    post:
      operationId: postAssets
      tags: [assets]
      summary: Single-call multipart upload
      description: |
        Upload bytes plus metadata in one `multipart/form-data` request. The
        platform streams the bytes through its trusted byte-path (CSAM scan +
        blake3), dedups by the server-computed hash, and mints the asset record.
        `201` for a brand-new blob, `200` if the bytes deduped to an existing
        blob, `202` if scanning is asynchronous (poll the returned asset URL).
      x-streaming-upload: true
      x-idempotency-key: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssetUploadForm'
            encoding:
              file:
                contentType: application/octet-stream
      responses:
        '200':
          description: Bytes deduped to an existing blob.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '201':
          description: New blob stored and asset minted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '202':
          description: Accepted; scanning asynchronously. Poll the asset URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'

  /api/v2/assets/from-hash:
    post:
      operationId: assetFromHash
      tags: [assets]
      summary: Dedup mint over existing bytes
      description: |
        Zero-byte fast-path: when the client already knows the blake3 of a blob
        the platform has, mint a new asset UUID over the existing bytes without
        re-uploading. `404 blob_not_found` on a miss (falls back to `postAssets`).
        Lookups are scoped to the calling account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetFromHashRequest'
      responses:
        '200':
          description: An identical reference already existed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '201':
          description: New asset reference minted over existing bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '404':
          $ref: '#/components/responses/Error'

  /api/v2/assets/by-hash/{hash}:
    head:
      operationId: headAssetByHash
      tags: [assets]
      summary: Existence check by hash
      description: |
        `200` if the calling account can mint from this blob, `404` otherwise.
        Lets the SDK decide between `assetFromHash` and a full upload before
        sending any bytes. Deliberately indistinguishable from "exists but you
        can't use it" so a hash cannot be probed across accounts.
      parameters:
        - $ref: '#/components/parameters/HashPath'
      responses:
        '200':
          description: The calling account can mint from this blob.
        '404':
          description: No blob the caller is authorized to mint from.

  /api/v2/assets/{id}:
    get:
      operationId: getAsset
      tags: [assets]
      summary: Asset metadata by UUID
      parameters:
        - $ref: '#/components/parameters/AssetIdPath'
      responses:
        '200':
          description: The asset object with a fresh content URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '404':
          $ref: '#/components/responses/Error'

  /api/v2/assets/{id}/content:
    get:
      operationId: getAssetContent
      tags: [assets]
      summary: Asset bytes (range-aware)
      description: |
        Serves the bytes directly on surfaces that store blobs themselves
        (self-hosted); issues a `302` to a fresh signed URL on Cloud/serverless.
        Range requests are supported for resumable downloads.
      x-binary-stream: true
      parameters:
        - $ref: '#/components/parameters/AssetIdPath'
        - name: Range
          in: header
          required: false
          schema:
            type: string
          description: Byte range, e.g. `bytes=0-1023`.
      responses:
        '200':
          description: Full body.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Partial body (range request satisfied).
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '302':
          description: Redirect to a fresh signed URL.
        '416':
          $ref: '#/components/responses/Error'

  /api/v2/jobs:
    post:
      operationId: postJobs
      tags: [jobs]
      summary: Submit a workflow
      description: |
        Submit an API-format workflow graph verbatim. Validation is synchronous;
        a `201` means the job is durably queued. `Idempotency-Key` makes a
        timed-out submit safely retryable (Stripe semantics).
      x-idempotency-key: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobSubmitRequest'
      responses:
        '201':
          description: Job durably queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '402':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'

  /api/v2/jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Job status, progress, and outputs
      description: |
        The authoritative state of a job. Carries the current status, the latest
        progress snapshot, and every output committed so far. This is the poll
        path that makes everything resumable; streaming is only a latency
        enhancement over it.
      parameters:
        - $ref: '#/components/parameters/JobIdPath'
      responses:
        '200':
          description: The current job object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/Error'

  /api/v2/jobs/{id}/events:
    get:
      operationId: getJobEvents
      tags: [jobs]
      summary: Live SSE event stream
      description: |
        A live `text/event-stream` of a job's state for low-latency progress UX.
        On connect the client receives the current snapshot, then future updates.
        The stream ends after the terminal `status` event. It is a live push, not
        a replayable log: events carry no `id`, there is no `Last-Event-ID`
        resume, and frames emitted while a consumer was disconnected are gone.
        Authoritative state always lives on `getJob`.
      x-sse-events:
        status: '#/components/schemas/StatusEventData'
        progress: '#/components/schemas/ProgressEventData'
        preview: '#/components/schemas/PreviewEventData'
        output: '#/components/schemas/OutputEventData'
        log: '#/components/schemas/LogEventData'
      parameters:
        - $ref: '#/components/parameters/JobIdPath'
      responses:
        '200':
          description: The SSE stream.
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/Error'

  /api/v2/jobs/{id}/cancel:
    post:
      operationId: cancelJob
      tags: [jobs]
      summary: Request cancellation
      description: |
        Requests cancellation and returns the current job object (`canceling` or
        already-terminal). Idempotent; canceling a finished job is a no-op that
        returns the terminal state.
      parameters:
        - $ref: '#/components/parameters/JobIdPath'
      responses:
        '200':
          description: The current job object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Optional per-surface bearer key. Self-hosted ComfyUI has no auth (send no
        header); Comfy Cloud and serverless require a key.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description: Client-generated UUID; makes the write safely retryable.
    HashPath:
      name: hash
      in: path
      required: true
      schema:
        type: string
      description: A `blake3:<hex>` content hash.
    AssetIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: The asset UUID.
    JobIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: The job UUID.

  responses:
    Error:
      description: A machine-readable error envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    JobStatus:
      type: string
      enum: [queued, running, succeeded, canceling, canceled, failed, expired]

    OutputType:
      type: string
      enum: [image, video, audio, text, file, latent]

    Asset:
      type: object
      required: [id, size_bytes, content_type, created_new, created_at, url, url_expires_at]
      properties:
        id:
          type: string
          description: Durable asset UUID (the value referenced from workflows).
        hash:
          type: [string, 'null']
          description: Server-computed blake3, lazily populated; may be null.
        size_bytes:
          type: integer
        content_type:
          type: string
        file_path:
          type: [string, 'null']
        created_new:
          type: boolean
          description: True for a brand-new blob, false for a dedup hit.
        created_at:
          type: string
          format: date-time
        url:
          type: string
        url_expires_at:
          type: string
          format: date-time

    Progress:
      type: object
      required: [value, nodes_done, nodes_total]
      properties:
        value:
          type: number
          description: Server-computed overall fraction (0..1).
        nodes_done:
          type: integer
        nodes_total:
          type: integer
        current_node:
          type: [string, 'null']
        current_node_class:
          type: [string, 'null']
        step:
          type: [integer, 'null']
        steps:
          type: [integer, 'null']
        message:
          type: [string, 'null']

    Output:
      type: object
      required: [node_id, name, type, content_type, size_bytes, id, url, url_expires_at]
      properties:
        node_id:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/OutputType'
        content_type:
          type: string
        size_bytes:
          type: integer
        id:
          type: string
        hash:
          type: [string, 'null']
        url:
          type: string
        url_expires_at:
          type: string
          format: date-time

    JobError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        node_id:
          type: [string, 'null']
        class_type:
          type: [string, 'null']
        traceback:
          type: [string, 'null']

    JobUrls:
      type: object
      required: [self, events, cancel]
      properties:
        self:
          type: string
        events:
          type: string
        cancel:
          type: string

    Job:
      type: object
      required: [id, status, created_at, expires_at, outputs, urls]
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, 'null']
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
        expires_at:
          type: string
          format: date-time
        queue_position:
          type: [integer, 'null']
        progress:
          oneOf:
            - $ref: '#/components/schemas/Progress'
            - type: 'null'
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/Output'
        error:
          oneOf:
            - $ref: '#/components/schemas/JobError'
            - type: 'null'
        metrics:
          type: object
          additionalProperties:
            type: [integer, 'null']
        urls:
          $ref: '#/components/schemas/JobUrls'

    AssetReferenceInfo:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: Authoritative asset UUID.
        hash:
          type: string
          description: blake3 dedup / cross-surface lookup hint.
        file_path:
          type: string
          description: Preserves the extension for nodes that sniff it.

    AssetReference:
      type: object
      description: The `core/ASSET` object placed into workflow JSON where a filename would go.
      required: [__type, info]
      properties:
        __type:
          type: string
          const: core/ASSET
        info:
          $ref: '#/components/schemas/AssetReferenceInfo'

    AssetUploadForm:
      type: object
      required: [file, content_type, file_path]
      properties:
        file:
          type: string
          format: binary
        content_type:
          type: string
        file_path:
          type: string
        expected_hash:
          type: string
          description: Optional; verified against the server-computed blake3, never trusted.
        tags:
          type: array
          items:
            type: string

    AssetFromHashRequest:
      type: object
      required: [hash]
      properties:
        hash:
          type: string
        file_path:
          type: string
        tags:
          type: array
          items:
            type: string

    JobSubmitRequest:
      type: object
      required: [workflow]
      properties:
        workflow:
          type: object
          additionalProperties: true
          description: API-format workflow graph, verbatim.

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: [object, 'null']
              additionalProperties: true

    StatusEventData:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/JobStatus'
        queue_position:
          type: [integer, 'null']

    ProgressEventData:
      $ref: '#/components/schemas/Progress'

    PreviewEventData:
      type: object
      required: [node_id, content_type, data_base64]
      properties:
        node_id:
          type: string
        content_type:
          type: string
        data_base64:
          type: string

    OutputEventData:
      $ref: '#/components/schemas/Output'

    LogEventData:
      type: object
      required: [level, message]
      properties:
        level:
          type: string
        message:
          type: string
