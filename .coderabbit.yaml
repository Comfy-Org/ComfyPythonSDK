# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
tone_instructions: |
  Direct and technical. Lead with the concrete risk or breakage, not praise.
  No compliments or filler — if a change is fine, say nothing.

reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  commit_status: true
  collapse_walkthrough: true

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"

  path_filters:
    - "!**/__pycache__/**"
    - "!**/*.pyc"
    - "!**/*.egg-info/**"
    - "!.venv/**"

  path_instructions:
    # Repo-wide review rules. These used to live in `tone_instructions`, but
    # that field is capped at 250 characters by the CodeRabbit schema, which
    # silently invalidated this whole file.
    - path: "**"
      instructions: |
        CI already runs `ruff check`, `ruff format --check`, and `mypy` on
        every PR — do not repeat their findings or nitpick style/formatting.

        Only comment on issues introduced by this PR's changes; do not flag
        pre-existing problems in moved, re-indented, or reformatted code.
    - path: "src/comfy_sdk/**"
      instructions: |
        Public SDK surface. Focus on:
        - Backward compatibility of public classes/functions (this is a
          published SDK; breaking a signature breaks every consumer)
        - Correct error handling and clear exceptions for network/API failures
        - Type hints kept accurate and exported where part of the public API
    - path: "tests/**"
      instructions: |
        Verify tests exercise the described behavior rather than just
        asserting current output (no change-detector tests).

  tools:
    ruff:
      enabled: false
    gitleaks:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 90000
    ast-grep:
      essential_rules: true

chat:
  auto_reply: true
